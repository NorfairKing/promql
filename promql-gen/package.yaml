name: promql-gen
version: 0.0.0
github: NorfairKing/promql
copyright: ! 'Copyright: (c) 2026 Tom Sydney Kerckhove'
license-file: LICENSE
synopsis: Generators and tests for promql
category: Monitoring
author: Tom Sydney Kerckhove
maintainer: syd@cs-syd.eu
license: AllRightsReserved

ghc-options:
- -Wall
- -Werror
- -Wincomplete-uni-patterns
- -Wincomplete-record-updates
- -Wpartial-fields
- -Widentities
- -Wredundant-constraints
- -Wcpp-undef
- -Wunused-packages

extra-source-files:
- CHANGELOG.md

dependencies:
- base >= 4.7 && < 5

library:
  source-dirs: src
  dependencies:
  - QuickCheck
  - genvalidity
  - genvalidity-text
  - promql
  - text

tests:
  promql-test:
    main: Spec.hs
    source-dirs: test
    build-tools: sydtest-discover
    ghc-options:
    - -threaded
    - -rtsopts
    - '"-with-rtsopts=-N"'
    dependencies:
    - QuickCheck
    - genvalidity-sydtest
    - promql
    - promql-gen
    - sydtest
    - text
