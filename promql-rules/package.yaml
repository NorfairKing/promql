name: promql-rules
version: 0.0.0
github: NorfairKing/promql
copyright: ! 'Copyright: (c) 2026 Tom Sydney Kerckhove'
license-file: LICENSE
synopsis: Prometheus rules, and unit tests for them, as types rather than as text
category: Monitoring
author: Tom Sydney Kerckhove
maintainer: syd@cs-syd.eu
license: AllRightsReserved

ghc-options:
- -Wall
- -Werror
- -Wincomplete-uni-patterns
- -Wincomplete-record-updates
- -Wpartial-fields
- -Widentities
- -Wredundant-constraints
- -Wcpp-undef
- -Wunused-packages

extra-source-files:
- CHANGELOG.md

dependencies:
- base >= 4.7 && < 5

library:
  source-dirs: src
  other-modules:
  - PromQL.Rule.Fields
  dependencies:
  - aeson-pretty
  - autodocodec
  - bytestring
  - containers
  - path
  - path-io
  - typed-process
  - promql
  - scientific
  - text
  - validity
  - validity-containers
  - validity-text
  - megaparsec
